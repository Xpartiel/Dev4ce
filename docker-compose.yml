services:

  # ═══════════════════════════════════════════════════════
  # Servicio db
  # ═══════════════════════════════════════════════════════
  db:
    image: postgis/postgis:16-3.4
    container_name: luciernagas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: luciernagas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:                                          # 👈 AGREGAR ESTO
      test: ["CMD-SHELL", "pg_isready -U postgres"]       # 👈
      interval: 5s                                        # 👈
      timeout: 5s                                         # 👈
      retries: 5                                          # 👈

  # ═══════════════════════════════════════════════════════
  # Servicio redis
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: luciernagas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:                                          # 👈 AGREGAR ESTO
      test: ["CMD", "redis-cli", "ping"]                  # 👈
      interval: 5s                                        # 👈
      timeout: 3s                                         # 👈
      retries: 5                                          # 👈

  # ═══════════════════════════════════════════════════════
  # Servicio web (Django)
  # ═══════════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luciernagas_web
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]    # 👈 CAMBIO #1
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:                                           # 👈 CAMBIAR ESTO
      db:                                                 # 👈
        condition: service_healthy                        # 👈
      redis:                                              # 👈
        condition: service_healthy                        # 👈

  # ═══════════════════════════════════════════════════════
  # Servicio celery
  # ═══════════════════════════════════════════════════════
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luciernagas_celery
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]    # 👈 CAMBIO #1 (también aquí)
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:                                           # 👈 CAMBIAR ESTO TAMBIÉN
      db:                                                 # 👈
        condition: service_healthy                        # 👈
      redis:                                              # 👈
        condition: service_healthy                        # 👈

volumes:
  postgres_data: